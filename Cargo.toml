[package]
name = "bake-test-rust"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/socketry/bake-test-rust"
description = "Reusable Rust test tasks for Bake"
readme = "readme.md"
include = ["src/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["socketry/managers"]

[lib]
name = "bake_test_rust"

[dependencies]
bake = "0.17.0"
serde_json = "1.0"
toml_edit = "0.25"
